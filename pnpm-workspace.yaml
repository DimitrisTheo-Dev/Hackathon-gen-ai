packages:
  - apps/*
  - packages/*
  # Deployed to Cloudflare with its own npm lockfile (see apps/machines/package.json).
  - '!apps/machines'

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@vercel/functions@3.11.3'
  - '@playwright/test@1.65.1'
  - playwright-core@1.65.1
  - playwright@1.65.1
